  <section class="container py-2 bg-light">
    <h1 class="py-4">Modifier le produit N002</h1>
    <div class="row card">
     <form class="row g-3 mt-0" action="" method="get">
        <div class="card-body col-lg-4">
        <label class="form-label" style="font-weight: 600;" style="width: 100px;" for="ref">Référence</label>
        <input  class="form-control" style="font-weight: 600;" type="text" name="ref" id="ref" value="N002">
         </div>
         <div class="card-body col-lg-8">
        <label class="form-label" style="font-weight: 600;" for="ref">Nom</label>
        <input class="form-control" style="font-weight: 600;" type="text" name="ref" id="ref" value="Smartphone itel A70,64Go">
        </div>


          <div class="card-body col-lg-6">
        <label class="form-label" style="font-weight: 600;" for="categorie">Catégorie</label>
        <select class="form-select" style="font-weight: 600;"  id="categorie" name="categorie">
          <option selected>Téléphones</option>
          <option>Écouteurs et audio</option>
        </select>
        </div>
        <div class="card-body col-lg-3">
        <label class="form-label" style="font-weight: 600;" for="ref">Prix d'achat(FCFA)</label>
        <input class="form-control" style="font-weight: 600;" type="number" name="ref" id="ref" value="4200">
        </div>
          <div class="card-body col-md-3">
            <label for="prixVente" class="form-label">Prix de vente (FCFA)</label>
            <input type="number" class="form-control is-invalid" style="font-weight: 600;" id="prixVente" name="prixVente" value="40000">
            <div class="invalid-feedback">
              Le prix de vente doit être supérieur au prix d'achat.
            </div>
          </div>

           <div class="card-body col-lg-3">
        <label class="form-label" style="font-weight: 600;" for="ref">Stock</label>
        <input class="form-control" style="font-weight: 600;" type="number" name="ref" id="ref" value="2">
        </div>
          <div class="card-body col-lg-3  ">
        <label class="form-label" style="font-weight: 600;" for="ref">Seuil d'alerte</label>
        <input class="form-control" style="font-weight: 600;" type="number" name="ref" id="ref" value="3">
        </div>
          <div class="card-body col-lg-6  ">
       
        </div>
          
        <div>
        <label class="form-label" style="font-weight: 600;" for="ref">Description</label>
        <textarea class="col-lg-12 p-2" name="" id=""  rows="3">Ecran 6,6 pouces, double SIM, 64Go</textarea>
        </div>
       
        <div class="mb-4">
        <button class="btn btn-dark">Enregistrer</button>
        <button class="btn btn-outline-dark">Annuler</button>
        </div>

        </div>

     </form>
    </div>
